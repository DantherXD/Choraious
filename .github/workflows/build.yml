# GitHub only looks for workflows in `.github/workflows/` at the repository root.
# The Android project itself lives in `Chora/`, so every run step executes there and
# artifact paths are prefixed with it.
name: dev build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch replaces the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Chora

jobs:
  build:
    name: assembleFossDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (foss flavor)
        # `foss` only: the `sfpro` flavor needs licensed SF Pro Display files that are
        # deliberately kept out of the repo (app/src/sfpro/FONTS.md), so it cannot build here.
        # The Android SDK platform/build-tools for compileSdk 37 are provisioned by AGP.
        run: ./gradlew assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-foss-debug
          # Artifact paths are relative to the workspace root, not the step's working directory.
          path: Chora/app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
          retention-days: 14
